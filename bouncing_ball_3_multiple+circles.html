<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dynamic Nested Rings</title>
<style>
  body {
    margin: 0;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  canvas {
    background: #000;
  }
</style>
</head>
<body>

<canvas id="canvas" width="500" height="500"></canvas>

<script>
/* =========================
   CANVAS INITIALIZATION
   ========================= */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const center = {
  x: canvas.width / 2,
  y: canvas.height / 2
};

/* =========================
   NESTED CIRCLE SETTINGS
   ========================= */
const circles = [];
const totalCircles = 50;
const outerRadius = 220;
const gapBetween = 4;
const gapLength = 40;

/* Create 50 rings with individual rotation speeds */
for (let i = 0; i < totalCircles; i++) {
  circles.push({
    radius: outerRadius - i * gapBetween,
    broken: false,

    // Each ring rotates differently
    angle: Math.random() * Math.PI * 2,
    speed: (Math.random() * 0.03 + 0.005) * (Math.random() < 0.5 ? -1 : 1)
  });
}

/* =========================
   PHYSICS SETTINGS
   ========================= */
const gravity = 0.15;
const balls = [];

/* =========================
   SPAWN SINGLE BALL
   ========================= */
function spawnBall(x, y, speed = 3) {
  const angle = Math.random() * Math.PI * 2;

  balls.push({
    x,
    y,
    radius: 6,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    color: "white",
    escapedLayer: -1   // Highest layer crossed so far
  });
}

/* Start with one ball */
spawnBall(center.x, center.y);

/* =========================
   ANGLE UTILITIES
   ========================= */

/* Normalize any angle to 0 → 2π */
function normalizeAngle(a) {
  return (a + Math.PI * 2) % (Math.PI * 2);
}

/* Check if a given angle lies inside this ring’s gap */
function isBallInGap(ballAngle, ringAngle, gapAngle) {
  const start = normalizeAngle(ringAngle - gapAngle / 2);
  const end   = normalizeAngle(ringAngle + gapAngle / 2);

  if (start < end) return ballAngle >= start && ballAngle <= end;
  return ballAngle >= start || ballAngle <= end;
}

/* =========================
   DRAWING
   ========================= */

/* Draw all intact rings */
function drawCircles() {
  ctx.lineWidth = 2;

  circles.forEach((circle, index) => {
    if (circle.broken) return; // Skip destroyed rings

    const gapAngle = gapLength / circle.radius;

    // Depth-based color variation
    ctx.strokeStyle = `hsl(${index * 6}, 70%, 60%)`;

    ctx.beginPath();
    ctx.arc(
      center.x,
      center.y,
      circle.radius,
      circle.angle + gapAngle / 2,
      circle.angle + Math.PI * 2 - gapAngle / 2
    );
    ctx.stroke();
  });
}

/* Draw the single ball */
function drawBall(ball) {
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
  ctx.fillStyle = ball.color;
  ctx.fill();
}

/* =========================
   BALL PHYSICS & BREAK LOGIC
   ========================= */

function updateBall() {
  const b = balls[0]; // Only one ball exists

  /* Apply gravity */
  b.vy += gravity;

  /* Move ball */
  b.x += b.vx;
  b.y += b.vy;

  const dx = b.x - center.x;
  const dy = b.y - center.y;
  const distance = Math.sqrt(dx * dx + dy * dy);
  const angle = normalizeAngle(Math.atan2(dy, dx));

  /* Check interaction with each ring */
  for (let layer = 0; layer < circles.length; layer++) {
    const circle = circles[layer];

    // Skip already destroyed or passed layers
    if (circle.broken || b.escapedLayer >= layer) continue;

    const gapAngle = gapLength / circle.radius;

    /* Collision condition */
    if (distance + b.radius >= circle.radius) {

      /* 🚪 Ball crosses gap → destroy ring immediately */
      if (isBallInGap(angle, circle.angle, gapAngle)) {

        circle.broken = true;      // Ring disappears
        b.escapedLayer = layer;   // Mark layer passed

        break;
      }

      /* 🔁 Bounce on intact ring */
      const nx = dx / distance;
      const ny = dy / distance;
      const dot = b.vx * nx + b.vy * ny;

      b.vx -= 2 * dot * nx;
      b.vy -= 2 * dot * ny;

      /* Slight damping */
      b.vx *= 0.99;
      b.vy *= 0.99;

      /* Reposition to prevent sticking */
      b.x = center.x + nx * (circle.radius - b.radius);
      b.y = center.y + ny * (circle.radius - b.radius);

      break;
    }
  }

  /* Remove only after fully leaving screen */
  if (
    b.x + b.radius < -50 ||
    b.x - b.radius > canvas.width + 50 ||
    b.y - b.radius > canvas.height + 50 ||
    b.y + b.radius < -50
  ) {
    balls.length = 0; // End simulation
  }
}

/* =========================
   MAIN ANIMATION LOOP
   ========================= */

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  /* Rotate each ring independently */
  circles.forEach(circle => {
    circle.angle += circle.speed;
  });

  drawCircles();
  updateBall();
  balls.forEach(drawBall);

  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
